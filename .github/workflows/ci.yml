name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Layout tests measure glyph boxes; the theme's first font is Inter, so
      # CI needs it installed or text metrics differ from local runs.
      - run: sudo apt-get update && sudo apt-get install -y fonts-inter && fc-match Inter
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
